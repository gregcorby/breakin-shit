<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256">
  <!-- Donkey fur texture -->
  <defs>
    <radialGradient id="fur">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B5345;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="url(#fur)"/>
  <!-- Fur detail -->
  <g opacity="0.3">
    <line x1="10" y1="10" x2="15" y2="20" stroke="#5A4335" stroke-width="1"/>
    <line x1="30" y1="15" x2="35" y2="25" stroke="#5A4335" stroke-width="1"/>
    <line x1="50" y1="20" x2="55" y2="30" stroke="#5A4335" stroke-width="1"/>
    <line x1="70" y1="10" x2="75" y2="20" stroke="#5A4335" stroke-width="1"/>
    <line x1="90" y1="25" x2="95" y2="35" stroke="#5A4335" stroke-width="1"/>
  </g>
</svg>
